<style>
:root{
  --bg:#F6F3EC; --surface:#FFFDF8; --ink:#1C1B19; --muted:#6B675E; --line:#DDD6C8;
  --west:#2D4E8A; --brics:#A65A16; --indie:#2E6B4F;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151412; --surface:#1E1C19; --ink:#EDE8DE; --muted:#A39D90; --line:#36322C;
    --west:#8FAEEA; --brics:#E9A15C; --indie:#79C49E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151412; --surface:#1E1C19; --ink:#EDE8DE; --muted:#A39D90; --line:#36322C;
  --west:#8FAEEA; --brics:#E9A15C; --indie:#79C49E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55;
}
.wrap{max-width:1080px; margin:0 auto; padding:0 22px 72px}
.serif{font-family:"Newsreader",Georgia,"Times New Roman",serif}

header{padding:44px 0 22px; border-bottom:3px double var(--ink); margin-bottom:34px}
.kicker{font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
h1{font-family:"Newsreader",Georgia,serif; font-weight:700; font-size:clamp(2.6rem,8vw,4.8rem); line-height:1; letter-spacing:-.02em; margin:14px 0 8px}
.lede{color:var(--muted); margin:0; max-width:56ch}

.section{margin-bottom:46px}
.section-head{display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:20px}
.section-head h2{font-family:"Newsreader",Georgia,serif; font-size:1.7rem; margin:0; font-weight:600}
.tag{width:12px; height:12px; border-radius:2px; flex:none; align-self:center}
.section-note{color:var(--muted); font-size:.88rem; margin-left:auto}

.grid{display:grid; gap:18px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--accent); border-radius:6px; padding:16px 18px 18px}
.card h3{margin:0 0 10px; font-size:1.02rem; font-weight:600; display:flex; justify-content:space-between; gap:8px}
.card h3 a{color:inherit; text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.card h3 .src{color:var(--muted); font-weight:400; font-size:.82rem}
.card ul{margin:0; padding-left:1.1em}
.card li{margin:0 0 9px; font-family:"Newsreader",Georgia,serif; font-size:1.08rem; line-height:1.35}
.card li::marker{color:var(--accent)}
.card li a{color:var(--ink); text-decoration:none; background-image:linear-gradient(var(--accent),var(--accent)); background-size:0 1px; background-repeat:no-repeat; background-position:0 100%; transition:background-size .2s}
.card li a:hover{background-size:100% 1px}
.placeholder{color:var(--muted); font-style:italic}
.date{display:block; font-family:"Instrument Sans",sans-serif; font-size:.8rem; color:var(--muted); margin-top:2px}
.empty-card{border-style:dashed; border-top-style:solid}

.west{--accent:var(--west)} .brics{--accent:var(--brics)} .indie{--accent:var(--indie)}
.tag.west{background:var(--west)} .tag.brics{background:var(--brics)} .tag.indie{background:var(--indie)}

footer{border-top:1px solid var(--line); padding-top:16px; color:var(--muted); font-size:.85rem}

/* summary view */
.back{display:inline-flex; gap:6px; align-items:center; color:var(--muted); text-decoration:none; font-size:.92rem; margin:34px 0 18px}
.back:hover{color:var(--ink)}
article.summary{max-width:68ch}
article.summary .kicker{justify-content:flex-start}
article.summary h1{font-size:clamp(2rem,5.5vw,3rem); line-height:1.1}
article.summary p{font-family:"Newsreader",Georgia,serif; font-size:1.18rem; line-height:1.6}
.watch{display:inline-block; margin-top:10px; padding:9px 16px; border:1px solid var(--ink); border-radius:999px; color:var(--ink); text-decoration:none; font-weight:500}
.watch:hover{background:var(--ink); color:var(--bg)}
:focus-visible{outline:2px solid var(--accent,var(--west)); outline-offset:3px}
</style>
</head>

const app = document.getElementById('app');
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (v != null) n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
};
const fmtDate = iso => {
  if (!iso) return null;
  const d = new Date(iso);
  return isNaN(d) ? null : d.toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
};
const placeholderItem = (text) => el('li', {}, el('span', { class:'placeholder' }, text));

  const updated = fmtDate(FEED.updated);
  app.replaceChildren(
    el('header', {},
      el('div', { class:'kicker' },

        el('span', {}, 'Three sections · Daily')),
      el('h1', {}, 'The Raramuri Daily Briefing'),
      el('p', { class:'lede' }, 'Western, BRICS and independent coverage, side by side. Click a headline to read the original article, or a video title to read its summary.')
    ),
    ...FEED.sections.map(renderSection),
    el('footer', {}, 'Headlines link to the original publishers. Video summaries are written by AI from each video’s transcript or, where none is available, its title and description.')
  );
  document.title = 'The Raramuri Daily Briefing';
}

    if (sec.id === 'indie'){
      const v = (src.videos || [])[0];
      if (v){
        const d = fmtDate(v.date);
        list.append(el('li', {}, el('a', { href:'#summary-' + src.slug }, v.title), d ? el('span', { class:'date' }, d) : null));
      } else list.append(placeholderItem('Latest video headline appears here'));
    } else {
      const hs = (src.headlines || []).slice(0, 3);
      hs.forEach(h => list.append(el('li', {},
        h.url ? el('a', { href:h.url, target:'_blank', rel:'noopener' }, h.title) : h.title)));
      for (let i = hs.length; i < 3; i++) list.append(placeholderItem('Headline ' + (i + 1)));
    }
    const nameNode = src.site ? el('a', { href:src.site, target:'_blank', rel:'noopener' }, src.name) : src.name;
    grid.append(el('div', { class:'card ' + sec.id },
      el('h3', {}, nameNode, sec.id === 'indie' ? el('span', { class:'src' }, 'YouTube')
        : src.country ? el('span', { class:'src' }, src.country) : null),
      list));
  }
  return el('section', { class:'section ' + sec.id, 'aria-labelledby':'h-' + sec.id },
    el('div', { class:'section-head' },
      el('span', { class:'tag ' + sec.id, 'aria-hidden':'true' }),
      el('h2', { id:'h-' + sec.id }, sec.title),
      el('span', { class:'section-note' }, sec.note)),
    grid);
}

function renderSummary(slug){
  const indie = FEED.sections.find(s => s.id === 'indie');
  const src = indie && indie.sources.find(s => s.slug === slug);
  if (!src) return renderHome();
  const v = (src.videos || [])[0];
  const body = el('article', { class:'summary indie' },
    el('div', { class:'kicker' }, el('span', {}, src.name + (v && fmtDate(v.date) ? ' · ' + fmtDate(v.date) : ''))),
    el('h1', {}, v ? v.title : 'No video loaded yet'));
  if (v && v.originalTitle && v.originalTitle !== v.title)
    body.append(el('p', { class:'placeholder', style:'font-size:.95rem' }, 'Original title: ' + v.originalTitle));
  if (v && v.summary){
    const basisNote = v.basis === 'transcript'
      ? 'Summary written from the video’s transcript.'
      : 'Summary written from the video’s public title and description, not its full transcript.';
    body.append(el('p', { class:'placeholder', style:'font-size:.95rem' }, basisNote));
    String(v.summary).split(/\n\s*\n/).forEach(p => body.append(el('p', {}, p.trim())));
  } else {
    body.append(el('p', { class:'placeholder' }, 'The summary of this channel’s latest video will appear here once the feed is updated.'));
  }
  if (v && v.url) body.append(el('a', { class:'watch', href:v.url, target:'_blank', rel:'noopener' }, 'Watch or listen ↗'));
  app.replaceChildren(el('a', { class:'back', href:'#' }, '← Back to the briefing'), body);
  document.title = (v ? v.title : src.name) + ' — The Raramuri Daily Briefing';
  window.scrollTo(0, 0);
}

function route(){
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('summary-')) renderSummary(h.slice(8));
  else renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
